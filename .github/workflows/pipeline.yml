name: OrderFlow CI

defaults:
  run:
    working-directory: ./orderflow-app # OrderFlow project is inside orderflow-app/

#workflow run on pull request, push and manually from UI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Least-privilege default token permissions. Workflow can read repository only 
permissions:
  contents: read

# A newer commit supersedes an older in-progress CI run for the same branch/PR.
# Commit A -> CI starts, concurrently Commit B -> CI starts, stop old commit A run
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Keep CI aligned with the Phase 2 image baseline for reproducibility.
  PYTHON_VERSION: "3.12"
  POSTGRES_DB: orderflow
  POSTGRES_USER: orderflow
  POSTGRES_PASSWORD: orderflow
  DATABASE_URL: postgresql+psycopg://orderflow:orderflow@localhost:5432/orderflow
  TEST_DATABASE_URL: postgresql+psycopg://orderflow:orderflow@localhost:5432/orderflow

jobs:
  ci:
    name: Build, Test and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20 #Maximum execution time

    services: #GitHub starts a PostgreSQL container alongside CI job.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: orderflow
          POSTGRES_USER: orderflow
          POSTGRES_PASSWORD: orderflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U orderflow -d orderflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false #checkout step doesn't leave the GitHub authentication 
            #credentials configured in the local Git repository.

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip #This makes CI faster. Later run use cached packages, This makes CI faster.
          cache-dependency-path: |  #GitHub uses these files to determine whether Python dependencies have changed.
            orderflow-app/requirements.txt
            orderflow-app/requirements-runtime.txt
            orderflow-app/requirements-dev.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify dependency consistency
        run: python -m pip check #This checks whether installed Python packages have incompatible dependencies.

      - name: Compile Python source
        run: python -m compileall -q app migrations tests #for Python syntax problems.

      - name: Lint with Ruff #Code quality gate.
        run: python -m ruff check app migrations tests #Ruff checks your Python code for coding problems and style issues.

      - name: Apply database migrations #Crucial Bring the CI PostgreSQL database to the latest migration version.
        run: PYTHONPATH=. alembic upgrade head

      - name: Verify migration state
        run: PYTHONPATH=. alembic check

      - name: Run tests with coverage #code coverage, coverage.xml is useful for tools such as SonarQube later in project.
        run: |
          python -m pytest \
            -q \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80
      #fail CI pipeline if cov is less than 80% test coverage

        #after CI finishes, you can download the coverage file from the workflow run.
      - name: Upload--cov-fail-under=80 coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orderflow-coverage-${{ github.sha }} #here SHA is commit ID
          path: orderflow-app/coverage.xml
          if-no-files-found: error
          retention-days: 7

        #phase 4 
      - name: SonarQube analysis and quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            
      # coming from phase3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1 # Immutable release; pin to SHA when managed centrally

      - name: Build production image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./orderflow-app
          file: ./orderflow-app/Dockerfile
          push: false #The workflow does not push the image to Docker Hub, ECR, GHCR, etc.
          tags: orderflow-api:ci-${{ github.sha }}
          cache-from: type=gha,scope=orderflow-ci # this is docker caching to make CI faster
          cache-to: type=gha,mode=max,scope=orderflow-ci

      - name: CI gate passed
        run: echo "All Phase 3 CI gates passed. No image was pushed."
